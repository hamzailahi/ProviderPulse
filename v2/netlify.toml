[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Routing. The site root is the patient app; the analyst dashboard keeps its
# own URLs. force = true is required on the first rule: without it Netlify
# serves the static /index.html for "/" and the rule never fires.
#
# index.html must stay reachable at that exact path — it is the target of the
# care-navigator map deep link (index.html#zip=&tax=&rec=&pins=), and patient.js
# builds that URL relatively. Do not rename it.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/"
  to = "/app.html"
  status = 200
  force = true

# Friendly URL for the analyst tool
[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

# The patient URL that has already been shared externally
[[redirects]]
  from = "/register-patient.html"
  to = "/app.html"
  status = 301
  force = true

[functions."ai-query"]
  timeout = 26

[functions."report-generate"]
  timeout = 26

[functions."cms-provider"]
  timeout = 10

# patient-match chains NPPES (6s) + two geocoder attempts (5s each) + Anthropic
# (15s abort). On Netlify's 10s default it could be killed mid-flight, returning a
# 502 for work that was about to succeed.
[functions."patient-match"]
  timeout = 26

# NPPES lookup (8s) + two LEIE exclusion queries (5s each) + four Supabase calls.
[functions."auth-register-provider"]
  timeout = 26

# Reads an uploaded document with Claude; the slowest call in the app.
[functions."doc-extract"]
  timeout = 26

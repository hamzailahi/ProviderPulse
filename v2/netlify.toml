[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Routing. The site root is the patient app; the analyst dashboard keeps its
# own URLs. force = true is required on the first rule: without it Netlify
# serves the static /index.html for "/" and the rule never fires.
#
# index.html must stay reachable at that exact path — it is the target of the
# care-navigator map deep link (index.html#zip=&tax=&rec=&pins=), and patient.js
# builds that URL relatively. Do not rename it.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/"
  to = "/app.html"
  status = 200
  force = true

# Friendly URL for the analyst tool
[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

# The patient URL that has already been shared externally
[[redirects]]
  from = "/register-patient.html"
  to = "/app.html"
  status = 301
  force = true

# map.html was the legacy sibling of index.html and has been deleted. Old links
# still exist in the wild, so keep sending them to the dashboard that superseded
# it rather than letting them hit the 404 page.
[[redirects]]
  from = "/map.html"
  to = "/dashboard"
  status = 301
  force = true

# One auth surface for both sides. Same page, different starting mode — the
# role toggle and sign-in/join state live in the hash, so these are rewrites
# (200) rather than redirects, and the URL the visitor typed is what they keep.
[[redirects]]
  from = "/signin"
  to = "/auth.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/auth.html"
  status = 200

# Netlify serves 404.html automatically for unmatched paths; this makes the
# behaviour explicit and covers deep paths under directories too.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[functions."ai-query"]
  timeout = 26

[functions."report-generate"]
  timeout = 26

[functions."cms-provider"]
  # Was capped at 10s (below the 26s ceiling) since this is a lazy, detail-only
  # popup enrichment call, not chained with anything else in a request budget.
  # Raised 2026-08-14: a live database-wide check found CMS's real-world
  # response time regularly exceeds 10s, which read identically to "not
  # found" to the caller and (before a separate fix the same day) got
  # wrongly cached as a confirmed miss. 20s gives the CMS fetch chain in
  # cms-provider.js actual room to finish before the platform kills it,
  # while staying under the 26s hard ceiling.
  timeout = 20

# patient-match chains NPPES (6s) + two geocoder attempts (5s each) + Anthropic
# (15s abort). On Netlify's 10s default it could be killed mid-flight, returning a
# 502 for work that was about to succeed.
[functions."patient-match"]
  timeout = 26

# NPPES lookup (8s) + two LEIE exclusion queries (5s each) + four Supabase calls.
[functions."auth-register-provider"]
  timeout = 26

# Reads an uploaded document with Claude; the slowest call in the app.
[functions."doc-extract"]
  timeout = 26

# Geocodes on save: Nominatim (5s) then Photon (5s), plus Supabase round trips.
[functions."provider-locations"]
  timeout = 26

# Up to 25 NPPES lookups at concurrency 6, batched Supabase reads, and any
# geocoding that survives the equal-address shortcut. The function stops
# starting work at 15s and persists what it has, so this ceiling is headroom
# for the writes rather than a target.
[functions."audit-run"]
  timeout = 26

# One Anthropic call covering the whole batch (15s abort) plus the write-back.
# Kept out of audit-run because a full 25-NPI audit can already spend its 15s
# budget, and the two together would exceed the 26s kill.
[functions."audit-narrate"]
  timeout = 26

# Auth check + appointment lookup + profile read + document-facts read, then
# one Anthropic call (12s abort) plus the upsert. Comfortably past the 10s
# default once the model call is in the chain.
[functions."appointment-briefing"]
  timeout = 20

# Was running on the 10s default despite already chaining a paged clinics
# query, a state demographics query, an 8000-row-capped HPSA query, and (for
# the catchment branch) a second paged CDC PLACES query. Added 2026-08-19: a
# parallel provider_individuals query at both the ZIP and catchment level, plus
# a medicare_county_enrollment query -- real added latency on a function that
# had no headroom configured at all.
[functions."market-score"]
  timeout = 20

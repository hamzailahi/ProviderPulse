<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ProviderPulse · Find care near you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/patient.css">
<link rel="stylesheet" href="assets/find.css">
</head>
<body>

<div class="aurora" aria-hidden="true"></div>

<div class="wrap">
  <header id="hdr" hidden>
    <div class="brand"><span class="mark" aria-hidden="true">✚</span> ProviderPulse</div>
    <div class="spacer"></div>
    <button class="pill" id="apptBtn" type="button" title="Your appointment requests">
      <span class="v">Appointments</span>
    </button>
    <button class="avatar" id="acctBtn" type="button" title="Your account" aria-label="Your account">·</button>
    <a class="pill" id="signinBtn" href="/signin" hidden><span class="v">Sign in</span></a>
  </header>

  <main id="main"></main>
</div>

<!-- Markup is intentionally minimal: every view is built in patient.js with the
     h() element helper, so no value from the API or the URL is ever interpolated
     into innerHTML. See the note at the top of patient.js. -->
<script src="assets/taxonomy-map.js"></script>
<script src="assets/specialties.js"></script>
<script src="assets/directory.js"></script>
<script src="assets/procedure-finder.js"></script>
<script src="assets/hospital-campuses.js"></script>
<script src="assets/patient.js"></script>
<script src="assets/admin-switch.js"></script>
</body>
</html>

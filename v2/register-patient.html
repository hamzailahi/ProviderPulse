<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProviderPulse · Find care near you</title>
<link rel="canonical" href="app.html">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/forms.css">
<script>
  // This URL has been shared externally, so it must keep resolving. The patient
  // experience now lives in app.html. netlify.toml also 301s this path; the
  // script is the belt-and-braces copy that works anywhere the redirect rules
  // are not applied (local static serving, previews, opening the file directly).
  // location.replace keeps it out of the back-button history, and search + hash
  // are carried over so old deep links still land in the right place.
  location.replace('app.html' + location.search + location.hash);
</script>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="card">
  <div class="brand"><h1>ProviderPulse</h1></div>
  <div class="eyebrow">Patient registration has moved.</div>
  <form onsubmit="return false">
    <p style="font-size:15px;line-height:1.6">
      Finding care now happens in the ProviderPulse app.
    </p>
    <a class="submit" href="app.html"
       style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">
      Continue →
    </a>
  </form>
</div>
</body>
</html>

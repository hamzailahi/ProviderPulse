# Root site (medicalpracticemap) — RETIRED.
#
# index.html is now a forwarding page to providerpulse-v2. There are no
# functions left here, which is why the [functions] block is gone: the v1 pages
# that used them are deleted, and every function the live product needs lives in
# v2/netlify/functions.
#
# Once medicalpracticemap is deleted in the Netlify dashboard, this file and
# index.html can be removed and the repo becomes v2-only.

[build]
  publish = "."
  # Never build this site again (the user disabled it, 2026-10-25). Netlify
  # runs this command before each build and skips the build when it exits 0.
  # providerpulse-v2 reads v2/netlify.toml, so this does not touch it.
  ignore = "exit 0"

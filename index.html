<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>ProviderPulse has moved</title>
<link rel="canonical" href="https://providerpulse-v2.netlify.app/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="5; url=https://providerpulse-v2.netlify.app/">
<!--
  The v1 access-request site is retired. This page replaces it rather than the
  files simply being deleted, so existing links and bookmarks land somewhere
  useful instead of a 404 while the Netlify site is still published.

  When medicalpracticemap is deleted in the Netlify dashboard, this file and the
  root netlify.toml can go too. The `access_requests` Supabase table is NOT
  touched by this — retiring the frontend leaves the data intact.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #07090d; color: #f2f6fa; min-height: 100vh;
    display: grid; place-items: center; padding: 24px; text-align: center;
    font: 15px/1.6 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  .glow { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .glow::before, .glow::after {
    content: ""; position: absolute; width: 60vw; height: 60vw; border-radius: 50%; filter: blur(90px);
  }
  .glow::before { background: rgba(45,212,191,.18); top: -20vw; left: -12vw; }
  .glow::after  { background: rgba(99,102,241,.18); bottom: -24vw; right: -14vw; }
  .box { position: relative; max-width: 440px; }
  .mark {
    width: 44px; height: 44px; border-radius: 13px; margin: 0 auto 18px;
    background: linear-gradient(135deg, #2dd4bf, #6366f1); color: #fff;
    display: grid; place-items: center; font-size: 22px; font-weight: 700;
  }
  h1 {
    font-family: ui-serif, "Iowan Old Style", Palatino, Georgia, serif;
    font-weight: 400; font-size: 30px; letter-spacing: -.02em; margin-bottom: 10px;
  }
  p { color: #93a3b8; margin-bottom: 22px; }
  a.go {
    display: inline-block; padding: 12px 22px; border-radius: 10px; text-decoration: none;
    background: linear-gradient(135deg, #2dd4bf, #6366f1); color: #fff; font-weight: 650;
  }
  .small { margin-top: 16px; font-size: 12.5px; color: #64748b; }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="box">
  <div class="mark" aria-hidden="true">✚</div>
  <h1>ProviderPulse has a new home</h1>
  <p>The access-request site has been retired. Everything now lives in one place —
     find care, claim a provider listing, or open the market dashboard.</p>
  <a class="go" href="https://providerpulse-v2.netlify.app/">Go to ProviderPulse →</a>
  <div class="small">Redirecting automatically in a few seconds.</div>
</div>
</body>
</html>

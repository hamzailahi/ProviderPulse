<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Healthcare Provider Map — Request Access</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh;
         display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #161b22; border: 1px solid #2a3444; border-radius: 12px; padding: 40px;
          width: 100%; max-width: 440px; }
  .logo { font-size: 13px; font-weight: 600; color: #58a6ff; letter-spacing: 0.08em;
          text-transform: uppercase; margin-bottom: 28px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 13px; color: #8b949e; margin-bottom: 28px; line-height: 1.6; }
  label { font-size: 12px; font-weight: 500; color: #8b949e; display: block; margin-bottom: 6px; }
  input, textarea { width: 100%; background: #1c2330; border: 1px solid #2a3444; border-radius: 6px;
                    padding: 10px 12px; font-size: 13px; color: #e6edf3; font-family: 'DM Sans', sans-serif;
                    margin-bottom: 16px; transition: border-color 0.2s; resize: none; }
  input:focus, textarea:focus { border-color: #3b82f6; outline: none; }
  button { width: 100%; background: #3b82f6; color: #fff; border: none; border-radius: 6px;
           padding: 12px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif;
           transition: background 0.2s; margin-top: 4px; }
  button:hover { background: #2563eb; }
  button:disabled { background: #2a3444; color: #484f58; cursor: not-allowed; }
  .msg { font-size: 13px; margin-top: 16px; padding: 10px 14px; border-radius: 6px; display: none; }
  .msg.success { background: #0d2b1d; border: 1px solid #238636; color: #3fb950; display: block; }
  .msg.error { background: #2d1117; border: 1px solid #da3633; color: #f85149; display: block; }
  .login-link { text-align: center; margin-top: 20px; font-size: 12px; color: #8b949e; }
  .login-link a { color: #58a6ff; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">IT Connections LLC</div>
  <h1>Request Map Access</h1>
  <p>This healthcare provider map is restricted. Fill out the form below to request access. You'll receive a time-limited access code within 24 hours.</p>

  <label>Full Name *</label>
  <input type="text" id="name" placeholder="Jane Smith" />

  <label>Email Address *</label>
  <input type="email" id="email" placeholder="jane@example.com" />

  <label>Organization</label>
  <input type="text" id="org" placeholder="Company or institution" />

  <label>Reason for Access</label>
  <textarea id="reason" rows="3" placeholder="Brief description of how you'll use this map..."></textarea>

  <button id="submitBtn" onclick="submitRequest()">Request Access</button>
  <div id="msg" class="msg"></div>

  <div class="login-link">Already have a code? <a href="/login.html">Sign in →</a></div>
</div>

<script>
  const SUPABASE_URL = "https://khkmdultmrggpfvkbfzj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_20jR_VjWJuUyj2_oiaHeZg_8VWHlJbQ";

  async function submitRequest() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const org = document.getElementById('org').value.trim();
    const reason = document.getElementById('reason').value.trim();
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');

    if (!name || !email) {
      msg.className = 'msg error';
      msg.textContent = 'Name and email are required.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';
    msg.className = 'msg';
    msg.style.display = 'none';

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/access_requests`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ name, email, organization: org, reason, status: 'pending' })
      });

      if (!res.ok) throw new Error('Submission failed');

      msg.className = 'msg success';
      msg.textContent = '✅ Request submitted! You\'ll receive your access code within 24 hours.';
      btn.textContent = 'Submitted';

    } catch(e) {
      msg.className = 'msg error';
      msg.textContent = '❌ Something went wrong. Please try again.';
      btn.disabled = false;
      btn.textContent = 'Request Access';
    }
  }
</script>
</body>
</html>

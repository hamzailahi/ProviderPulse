<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Healthcare Provider Map — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh;
         display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #161b22; border: 1px solid #2a3444; border-radius: 12px; padding: 40px;
          width: 100%; max-width: 400px; }
  .logo { font-size: 13px; font-weight: 600; color: #58a6ff; letter-spacing: 0.08em;
          text-transform: uppercase; margin-bottom: 28px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 13px; color: #8b949e; margin-bottom: 28px; line-height: 1.6; }
  label { font-size: 12px; font-weight: 500; color: #8b949e; display: block; margin-bottom: 6px; }
  input { width: 100%; background: #1c2330; border: 1px solid #2a3444; border-radius: 6px;
          padding: 10px 12px; font-size: 13px; color: #e6edf3; font-family: 'DM Sans', sans-serif;
          margin-bottom: 16px; transition: border-color 0.2s; letter-spacing: 0.1em; }
  input:focus { border-color: #3b82f6; outline: none; }
  button { width: 100%; background: #3b82f6; color: #fff; border: none; border-radius: 6px;
           padding: 12px; font-size: 14px; font-weight: 500; cursor: pointer;
           font-family: 'DM Sans', sans-serif; transition: background 0.2s; }
  button:hover { background: #2563eb; }
  button:disabled { background: #2a3444; color: #484f58; cursor: not-allowed; }
  .msg { font-size: 13px; margin-top: 16px; padding: 10px 14px; border-radius: 6px; display: none; }
  .msg.success { background: #0d2b1d; border: 1px solid #238636; color: #3fb950; display: block; }
  .msg.error { background: #2d1117; border: 1px solid #da3633; color: #f85149; display: block; }
  .back-link { text-align: center; margin-top: 20px; font-size: 12px; color: #8b949e; }
  .back-link a { color: #58a6ff; text-decoration: none; }

  @media (max-width: 480px) {
    body { padding: 16px; justify-content: flex-start; padding-top: 60px; }
    .card { padding: 28px 20px; border-radius: 10px; }
    h1 { font-size: 20px; }
    input { font-size: 16px; } /* prevents iOS zoom on focus */
    button { padding: 14px; font-size: 15px; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">IT Connections LLC</div>
  <h1>Enter Access Code</h1>
  <p>Enter the access code sent to your email. Codes are valid for 48 hours.</p>

  <label>Email Address</label>
  <input type="email" id="email" placeholder="jane@example.com" />

  <label>Access Code</label>
  <input type="text" id="code" placeholder="XXXXXXXX" maxlength="10"
         oninput="this.value = this.value.toUpperCase()" />

  <button id="loginBtn" onclick="login()">Access Map</button>
  <div id="msg" class="msg"></div>

  <div class="back-link"><a href="/index.html">← Request access</a></div>
</div>

<script>

  async function login() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const code = document.getElementById('code').value.trim().toUpperCase();
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('msg');

    if (!email || !code) {
      msg.className = 'msg error';
      msg.textContent = 'Email and code are required.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Verifying...';

    try {
      const res = await fetch('/.netlify/functions/validate-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, code })
      });
      const data = await res.json();

      if (!data.ok) throw new Error(data.error || 'Invalid code or email');

      // Store session in localStorage
      const session = {
        email,
        code,
        expires_at: data.expires_at,
        granted_at: new Date().toISOString()
      };
      localStorage.setItem('map_session', JSON.stringify(session));

      msg.className = 'msg success';
      msg.textContent = '✅ Access granted! Redirecting...';

      setTimeout(() => { window.location.href = '/map.html'; }, 1000);

    } catch(e) {
      msg.className = 'msg error';
      msg.textContent = `❌ ${e.message}`;
      btn.disabled = false;
      btn.textContent = 'Access Map';
    }
  }

  // Auto-redirect if already logged in
  window.addEventListener('load', () => {
    const session = JSON.parse(localStorage.getItem('map_session') || 'null');
    if (session && new Date(session.expires_at) > new Date()) {
      window.location.href = '/map.html';
    }
  });
</script>
</body>
</html>

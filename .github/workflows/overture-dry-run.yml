name: Overture addresses dry run

# Manual, read only. How many listings with no pin the Overture Maps
# addresses theme (free, open, public S3 bucket) would place, by state and by
# source dataset and licence (scripts/overture-dry-run.sh). Writes nothing to
# the database; commits supabase/reference/overture-dry-run.md.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Overture release, e.g. 2026-10-22.0 (blank: the newest)'
        required: false

permissions:
  contents: write

concurrency:
  group: overture-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.repository_owner == 'hamzailahi'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the secret is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::Add the repository secret SUPABASE_DB_URL."; exit 1; fi
      - name: Install psql 17 and DuckDB
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          pip install duckdb==1.1.3
      - name: Dry run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OVERTURE_RELEASE: ${{ inputs.release }}
          WORK: ${{ runner.temp }}
        run: |
          [ -n "$OVERTURE_RELEASE" ] || unset OVERTURE_RELEASE
          bash scripts/overture-dry-run.sh
      - name: Summary
        if: always()
        run: cat supabase/reference/overture-dry-run.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Commit the report
        run: |
          git add supabase/reference/overture-dry-run.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Overture addresses dry run $(date -u +%F) [skip netlify]"
          git pull -q --rebase origin main
          git push origin HEAD:main

name: Doctors and Clinicians discovery

# Manual, read only: reads CMS Doctors and Clinicians file (mj5m-pzi6) columns, counts, multi-site
# and graduation years. Commits supabase/reference/dac-discovery.md.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/dac-discover.mjs
      - name: Commit the report
        run: |
          git add supabase/reference/dac-discovery.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Doctors and Clinicians discovery $(date -u +%F) [skip netlify]"
          git pull -q --rebase origin main
          git push origin HEAD:main

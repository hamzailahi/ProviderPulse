name: Market concentration dry run

# Manual, read only (2026-11-20, step 7 of the research plan). No database:
# CMS Doctors and Clinicians + Facility Affiliation + AHRQ Compendium 2023.
on:
  workflow_dispatch:
    inputs:
      areas:
        description: 'name:ZIP3,ZIP3;name:ZIP3'
        default: 'Memphis:380,381;Fort Worth:760,761'

permissions:
  contents: write

jobs:
  run:
    if: github.repository_owner == 'hamzailahi'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node scripts/hhi-dry-run.mjs --areas "${{ inputs.areas }}" --report supabase/reference/hhi-dry-run.md
      - name: Commit
        run: |
          git add supabase/reference/hhi-dry-run.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "HHI dry run $(date -u +%F) [skip netlify]"
          git pull -q --rebase origin main
          git push origin HEAD:main

name: Fax number backfill

# Manual only. Fills clinics.fax (NPI-2 organizations) and
# provider_individuals.fax (NPI-1 clinicians) from the NPPES monthly full
# file. Neither table had a fax column before; the only fax anywhere in the
# product was a live, non-persisted NPI Registry API lookup in the
# dashboard popup. See scripts/fax-backfill.sh.
#
# Run dry_run first: it writes nothing to the database and commits a
# summary to supabase/reference/. Apply needs the free disk shown in
# Supabase (Settings, Compute and Disk), runs migration 047 (adds the
# columns), updates both tables in batches, and refuses if the disk is
# short. Re-running resumes: rows already right are skipped, so if a run
# times out, just run it again with the same inputs.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry_run writes nothing; apply adds the columns and writes faxes
        type: choice
        options: [dry_run, apply]
        default: dry_run
      disk_free_gb:
        description: Free database disk in GB, from Supabase (needed for apply)
        required: false
      nppes_url:
        description: Optional direct link to the NPPES monthly zip (skips the download page)
        required: false

permissions:
  contents: write

concurrency:
  group: fax-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check the secret is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the repository secret SUPABASE_DB_URL (Supabase, Connect, Session pooler string)."
            exit 1
          fi

      - name: Install psql 17
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Backfill
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MODE: ${{ inputs.mode }}
          DISK_FREE_GB: ${{ inputs.disk_free_gb }}
          NPPES_URL: ${{ inputs.nppes_url }}
          WORK: ${{ runner.temp }}/faxbf
        run: bash scripts/fax-backfill.sh

      - name: Summary
        if: always()
        run: |
          [ -f supabase/reference/fax-backfill-summary.md ] && cat supabase/reference/fax-backfill-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit the summary
        if: always()
        run: |
          git add supabase/reference/fax-backfill-summary.md 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Fax backfill (${{ inputs.mode }}) $(date -u +%F) [skip netlify]"
          git pull -q --rebase origin main
          git push origin HEAD:main

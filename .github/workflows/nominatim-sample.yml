name: Nominatim sample test

# Manual, read only. Sends a sample of listings with no pin to Nominatim
# (OpenStreetMap's free geocoder), one request a second, and reports how many
# come back as a real building with the same house number and ZIP
# (scripts/nominatim-sample.mjs). It does not touch the database and keeps no
# coordinates; commits supabase/reference/nominatim-sample.md.

on:
  workflow_dispatch:
    inputs:
      data_branch:
        description: 'tmp/ branch holding nominatim-sample.csv.gz'
        default: 'tmp/nominatim-sample'
      limit:
        description: 'Most listings to send'
        default: '500'

permissions:
  contents: write

concurrency:
  group: nominatim-sample
  cancel-in-progress: false

jobs:
  sample:
    if: github.repository_owner == 'hamzailahi'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Test
        env:
          DATA_BRANCH: ${{ inputs.data_branch }}
          LIMIT: ${{ inputs.limit }}
          W: ${{ runner.temp }}
        run: |
          case "$DATA_BRANCH" in tmp/*) ;; *) echo "data_branch must start with tmp/"; exit 1;; esac
          case "$LIMIT" in ''|*[!0-9]*) echo "limit must be a number"; exit 1;; esac
          [ "$LIMIT" -le 2000 ] || { echo "limit is at most 2000"; exit 1; }
          git fetch -q origin "$DATA_BRANCH"
          git show FETCH_HEAD:nominatim-sample.csv.gz | gunzip > "$W/sample.csv"
          node scripts/nominatim-sample.mjs --rows "$W/sample.csv" --out supabase/reference/nominatim-sample.md --limit "$LIMIT"
      - name: Summary
        if: always()
        run: cat supabase/reference/nominatim-sample.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Commit the report
        run: |
          git add supabase/reference/nominatim-sample.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Nominatim sample test $(date -u +%F) [skip netlify]"
          git pull -q --rebase origin main
          git push origin HEAD:main

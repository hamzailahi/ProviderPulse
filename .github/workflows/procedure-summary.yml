name: Procedure summary

# Manual, read only for now. Streams cms_procedures_full out with a plain
# COPY (no sort on the server), sums it per ZIP, specialty and code with
# DuckDB on the runner, and reports how big that summary would be
# (scripts/build-procedure-summary.py). Nothing is written to the database;
# a load needs its own migration and the user's go-ahead after this report.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: procedure-summary
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.repository_owner == 'hamzailahi'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install duckdb==1.1.3

      - name: Check the secret is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::Add the repository secret SUPABASE_DB_URL."; exit 1; fi

      - name: Install psql 17
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dry run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 scripts/build-procedure-summary.py --mode dry_run

      - name: Summary
        if: always()
        run: cat supabase/reference/procedure-sources/summary-dry-run.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Commit the report
        if: success()
        run: |
          git add supabase/reference/procedure-sources/summary-dry-run.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Procedure summary dry run $(date -u +%F) [skip netlify]"
          git pull -q --rebase origin main
          git push origin HEAD:main

name: Public query check

# Manual, read only. Runs one PostgREST query exactly as the browser does
# (publishable key, public data only) against clinics, provider_individuals
# and clinic_secondary_locations, and prints the HTTP status, timing, row
# count and any error body to the run summary. For diagnosing a page that
# shows "nothing found" when a query actually failed or timed out.

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Query string after the table name, e.g. latitude=gte.35&latitude=lte.35.1&select=npi"
        required: true
      tables:
        description: Space-separated tables to query
        default: clinics provider_individuals clinic_secondary_locations
      show:
        description: "Also print up to this many rows (public data only; 0 = counts only)"
        default: "0"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query
        env:
          Q: ${{ inputs.query }}
          T: ${{ inputs.tables }}
          SHOW: ${{ inputs.show }}
        run: |
          U="https://khkmdultmrggpfvkbfzj.supabase.co/rest/v1"
          K="sb_publishable_20jR_VjWJuUyj2_oiaHeZg_8VWHlJbQ"
          {
            for t in $T; do
              q="$Q"; [ "$t" = clinic_secondary_locations ] && q="${Q/select=npi,/select=npi:parent_npi,}"
              out=$(curl -s -o /tmp/body -w '%{http_code} %{time_total}' "$U/$t?$q&limit=1000&offset=0" -H "apikey: $K")
              n=$(python3 -c "import json;d=json.load(open('/tmp/body'));print(len(d) if isinstance(d,list) else 'error')" 2>/dev/null || echo 'not json')
              echo "- $t: HTTP/time $out, rows $n"
              [ "$n" = error ] || [ "$n" = "not json" ] && { echo '```'; head -c 600 /tmp/body; echo; echo '```'; }
              if [ "${SHOW:-0}" != "0" ] && [ "$n" != error ] && [ "$n" != "not json" ]; then
                echo '```'; python3 -c "import json,sys;d=json.load(open('/tmp/body'));[print(json.dumps(r)[:400]) for r in d[:int(sys.argv[1])]]" "$SHOW"; echo '```'
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

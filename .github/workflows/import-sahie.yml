name: Import Census SAHIE

# Feeds sahie_county (migration 027): the Census Bureau's model-based county
# uninsured estimates for people under 65. SAHIE trails by about two years and
# is released in the summer, so this runs every September and whenever
# triggered by hand (run it once right after applying migration 027).
# CENSUS_API_KEY is required (free: https://api.census.gov/data/key_signup.html).
on:
  schedule:
    - cron: '0 10 10 9 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and check the data without writing to Supabase'
        type: boolean
        default: false

concurrency: import-sahie

jobs:
  import:
    if: github.repository_owner == 'hamzailahi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets are required"
            exit 1
          fi
          if [ -z "${{ secrets.CENSUS_API_KEY }}" ]; then
            echo "::error::CENSUS_API_KEY repository secret is required. Free key: https://api.census.gov/data/key_signup.html (click the activation link in the email)"
            exit 1
          fi

      - name: Import SAHIE
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${IN_DRY_RUN:-}" = "true" ]; then
            node scripts/import-sahie.mjs --dry-run
          else
            node scripts/import-sahie.mjs
          fi

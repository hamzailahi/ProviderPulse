name: Procedures summary check

# Manual only. Read-only: confirms the ZIP-level summary from migration 031
# (cms_procedures_by_zip) carries exactly what the dashboard's Procedures
# panel computes from cms_procedures_full, before migration 032 drops the
# per-provider table. Fails on any mismatch. Needs SUPABASE_DB_URL.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Install psql 17
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Compare
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/check-procedures-summary.sh
      - name: Summary and commit
        if: always()
        run: |
          [ -f supabase/reference/procedures-summary-check.md ] || exit 0
          cat supabase/reference/procedures-summary-check.md >> "$GITHUB_STEP_SUMMARY"
          git add supabase/reference/procedures-summary-check.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Procedures summary check $(date -u +%F) [skip netlify]"
          git push origin HEAD:main

name: NPPES weekly refresh

# Adds new NPIs, updates changed ones and removes deactivated ones in clinics,
# provider_individuals and clinic_secondary_locations, from NPPES's weekly
# increment files (the user's choices, 2026-10-25: weekly file with an API
# fallback, apply additions, changes and deactivations, accurate geocoding,
# weekly and automatic). scripts/nppes-refresh.sh has the flow; it refuses to
# write when a week's totals look abnormal (LIMITS in
# scripts/lib/nppes-refresh.mjs). The state (last week applied, NPIs held back
# by a geocoder outage, the API cursor), the latest summary and a history line
# per run are committed to supabase/reference/nppes-refresh/.
on:
  schedule:
    # Wednesdays 09:23 UTC: NPPES posts the week ending Sunday early in the
    # following week.
    - cron: '23 9 * * 3'
    # Daily: the one-time March-to-now catch-up from the monthly full file,
    # started the first morning CMS's download site offers it again (the
    # user's choice, 2026-10-25: wait for the file rather than sweep the API).
    # A quiet no-op while the site is down or once the catch-up is done.
    - cron: '41 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto (weekly files, API fallback), weekly (no fallback), catchup (the monthly file once, when CMS offers it), full (the monthly file now), api'
        type: choice
        options: [auto, weekly, catchup, full, api]
        default: auto
      dry_run:
        description: 'Plan and geocode a sample; write nothing'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write     # a catch-up that stops at its time budget starts the next run

concurrency:
  group: nppes-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository_owner == 'hamzailahi'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check the secrets are set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets are required"; exit 1
          fi

      - name: Refresh
        id: refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Census only for now (the user's choice, 2026-10-25). Passing
          # GOOGLE_GEOCODING_KEY here would turn on the Google tier.
          MODE: ${{ github.event.schedule == '41 7 * * *' && 'catchup' || inputs.mode || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: bash scripts/nppes-refresh.sh

      # Weeks that finished are recorded even when a later one failed, so the
      # next run starts after them.
      - name: Commit the state and summary
        if: always() && inputs.dry_run != true
        run: |
          git add supabase/reference/nppes-refresh
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "NPPES refresh $(date -u +%F) [skip netlify]"
          git pull -q --rebase origin main
          git push origin HEAD:main

      # A catch-up too big for one run stops at its budget; start the next
      # one straight away instead of waiting for tomorrow's check.
      - name: Continue a stopped catch-up
        if: success() && steps.refresh.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run nppes-refresh.yml --ref main -f mode=catchup -f dry_run=false
          echo "Started the next catch-up run." | tee -a "$GITHUB_STEP_SUMMARY"

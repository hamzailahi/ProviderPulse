name: Population-weighted ZIP centres
# Step 10 (2026-11-23): each ZIP's population-weighted centre from 2020 Census
# blocks. dry_run builds and reports; apply also loads zip_pop_centres (059).
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry_run, apply]
        default: dry_run
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyogrio==0.10.0 pandas
      - run: sudo apt-get -o Acquire::Retries=8 install -y postgresql-client >/dev/null
      - run: bash scripts/zip-pop-centres.sh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MODE: ${{ inputs.mode }}
      - name: Commit the report
        run: |
          git add supabase/reference/zip-pop-centres.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Population-weighted ZIP centres $(date -u +%F) [skip netlify]"
          git pull -q --rebase origin main
          git push origin HEAD:main

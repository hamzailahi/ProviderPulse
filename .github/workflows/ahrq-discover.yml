name: AHRQ health systems discovery

# Manual, read only (2026-11-20). scripts/ahrq-discover.mjs records the AHRQ
# Compendium of U.S. Health Systems files' columns and samples to
# supabase/reference/ahrq/discovery.md.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    if: github.repository_owner == 'hamzailahi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node scripts/ahrq-discover.mjs
      - name: Commit
        run: |
          git add supabase/reference/ahrq
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "AHRQ discovery $(date -u +%F) [skip netlify]"
          git pull -q --rebase origin main
          git push origin HEAD:main

name: Train demand model

# Fits the learned demand model (v2/assets/demand-model.js) from the CMS
# Physician & Other Practitioners by-Provider file, the Census ACS and CDC PLACES
# tables, and writes one market_benchmarks row per specialty (kind
# 'demand_model', migration 025). MANUAL ONLY since 2026-10-06: the second
# dry run found 0 of 33 specialties usable (supply explains 0.40-0.78 of the
# variance and population inputs add under 0.03), so the quarterly schedule
# was removed. Run it by hand, dry run first, if the label or inputs change.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Train and print the held-out scores without writing to Supabase'
        type: boolean
        default: false
      puf_url:
        description: 'Optional: direct CSV link to the CMS Physician & Other Practitioners by-Provider file (skips the catalog lookup)'
        type: string
        default: ''

concurrency: train-demand-model

jobs:
  build:
    if: github.repository_owner == 'hamzailahi'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets are required"
            exit 1
          fi

      - name: Train
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_PUF_URL: ${{ inputs.puf_url }}
        run: |
          set -euo pipefail
          ARGS=()
          [ "${IN_DRY_RUN:-}" = "true" ] && ARGS+=(--dry-run) || true
          [ -n "${IN_PUF_URL:-}" ] && ARGS+=(--puf-url "$IN_PUF_URL") || true
          node scripts/train-demand-model.mjs "${ARGS[@]}"

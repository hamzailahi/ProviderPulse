name: Tests

# The only workflow that runs on pull requests. Every other file in this
# directory is a scheduled data import, so before this the unit tests in
# scripts/test-*.mjs only ever ran when someone remembered to run them locally.
# No secrets and no network: everything here is pure and dependency-free.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The functions' one dependency (the Anthropic SDK), so every function
      # can be loaded below exactly as Netlify bundles it.
      - name: Install function dependencies
        run: npm ci --prefix v2 --no-audit --no-fund

      # Catches a syntax error in any function before Netlify deploys it.
      - name: Syntax-check functions, assets and scripts
        run: |
          set -euo pipefail
          for f in v2/netlify/functions/*.js v2/netlify/functions/lib/*.js v2/assets/*.js scripts/*.mjs scripts/lib/*.mjs; do
            node --check "$f"
          done

      # Requiring each handler catches a broken require() path or a throw at
      # module load, which --check alone does not.
      - name: Load every function
        run: node -e "for (const f of require('fs').readdirSync('v2/netlify/functions').filter(f => f.endsWith('.js'))) require('./v2/netlify/functions/' + f)"

      - name: Scoring engine
        run: node scripts/test-accuracy-signals.mjs

      - name: Market-memo query allowlist
        run: node scripts/test-query-plan.mjs

      - name: Claimed-listing specialty gating
        run: node scripts/test-claimed-relevance.mjs

      - name: Learned demand model and its trainer
        run: node scripts/test-demand-model.mjs

      - name: Census SAHIE county uninsured estimates
        run: node scripts/test-sahie.mjs

      - name: Census ACS detail import and income ranking
        run: node scripts/test-acs.mjs

      - name: What-if scenario scoring
        run: node scripts/test-scenario.mjs

      - name: Assistant figures trace to tool results
        run: node scripts/test-answer-check.mjs

      - name: Provider-density benchmark is like for like
        run: node scripts/test-density-benchmark.mjs

      - name: Patient sign-up stays closed unless opened
        run: node scripts/test-signup-gate.mjs

      - name: Market opportunity model
        run: |
          node scripts/test-market-model.mjs
          node scripts/test-market-benchmarks.mjs

      - name: NUCC taxonomy map (and the generated file is in sync)
        run: |
          node scripts/build-taxonomy-map.mjs --check
          node scripts/build-hospital-campuses.mjs --check
          node scripts/test-taxonomy-map.mjs
          node scripts/test-patient-query.mjs

      - name: Insurance plan proposal logic
        run: node scripts/test-payers.mjs

      - name: Procedures panel word search, against CMS's real descriptions
        run: node scripts/test-procedure-search.mjs

      - name: The assistant's find_providers tool (competitors by code), on a fake database
        run: node scripts/test-providers-near.mjs

      - name: Market score catchment (10 miles, ZIP groups, failed loads)
        run: node scripts/test-catchment.mjs

      - name: Organization phones from NPPES
        run: node scripts/test-org-phones.mjs

      - name: Listing names and cities
        run: node scripts/test-display-names.mjs

      - name: Patient procedure finder
        run: node scripts/test-procedure-finder.mjs

      - name: Public Medicare activity lookup
        run: node scripts/test-npi-activity.mjs

      - name: Report a wrong listing
        run: node scripts/test-listing-report.mjs

      - name: NPPES weekly refresh
        run: node scripts/test-nppes-refresh.mjs

      - name: Hospital campuses
        run: node scripts/test-hospital-campuses.mjs

      - name: Typed addresses only match what was typed
        run: node scripts/test-address-fit.mjs

      - name: Admin account and view switch
        run: node scripts/test-admin.mjs

      - name: Provider listing self-check
        run: node scripts/test-self-check.mjs

      - name: One account, many NPIs
        run: node scripts/test-provider-npis.mjs

      - name: Stray ZIPs left out of a city search
        run: node scripts/test-area-zips.mjs

      - name: Procedures tab code-list search (parse and summaries)
        run: node scripts/test-code-list.mjs

      - name: The assistant's get_procedures tool, on a fake database
        run: node scripts/test-procedures-tool.mjs

      - name: The assistant's get_area_profile tool (every ZIP on the map), on a fake database
        run: node scripts/test-area-profile.mjs

      - name: Procedure tables builder (Medicaid and Medicare hospital), end to end on fixtures
        run: |
          pip install -q duckdb==1.1.3
          python3 scripts/test-procedure-tables.py

      - name: Market assistant (stepped agent, tools, history rules)
        run: node scripts/test-market-assistant.mjs

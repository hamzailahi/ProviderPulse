name: Clinician address check

# Compares every clinician listing's state and ZIP with CMS Doctors and
# Clinicians (Medicare enrollment, monthly) and commits counts to
# supabase/reference/address-check.md; the per-NPI list is a 7-day artifact.
# NPIs in check_npis are printed in the job log only. mode apply (and the
# monthly schedule, the user's choice 2026-11-20) shows moved clinicians at
# their Medicare address, keeps the NPPES one beside it, puts back any that no
# longer qualify and refreshes their other Medicare offices
# (scripts/address-apply.sh, migration 056).
on:
  schedule:
    - cron: '23 6 4 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry_run or apply'
        default: 'dry_run'
      check_npis:
        description: 'NPIs to print in the log (comma separated)'
        default: ''

permissions:
  contents: write

jobs:
  check:
    if: github.repository_owner == 'hamzailahi'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install psql 17
        run: |
          sudo apt-get -o Acquire::Retries=8 update -q
          sudo apt-get -o Acquire::Retries=8 install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get -o Acquire::Retries=8 install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CHECK: ${{ inputs.check_npis }}
          MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
        run: bash scripts/address-apply.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: address-mismatches
          path: /tmp/addr/address-mismatches.csv.gz
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit the report
        run: |
          cat supabase/reference/address-check.md >> "$GITHUB_STEP_SUMMARY"
          git add supabase/reference/address-check.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Clinician address check $(date -u +%F) [skip netlify]"
          git pull -q --rebase origin main
          git push origin HEAD:main

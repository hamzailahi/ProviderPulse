name: Hospital campus candidates

# Manual, read only. Lists addresses that look like hospital campuses missing
# from patient search's Emergency rooms & hospitals door (an organization
# named hospital or medical center under a non-hospital code, with no
# hospital-coded listing within about 200 m), for review. Nothing is added
# automatically: an approved campus goes into
# supabase/reference/hospital-campuses.csv by hand. scripts/hospital-campus-candidates.sh
# has the query; the results are committed to supabase/reference/.
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'candidates (the full list) or parents (hospital listings near each shortlisted campus)'
        type: choice
        options: [candidates, parents, lookup]
        default: candidates
      npis:
        description: 'lookup only: comma-separated NPIs to print from the directory tables (registry name, address, code)'
        required: false

permissions:
  contents: write

jobs:
  candidates:
    if: github.repository_owner == 'hamzailahi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check the secret is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the repository secret SUPABASE_DB_URL (Supabase, Connect, Session pooler string)."
            exit 1
          fi

      - name: Install psql 17
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Find candidates
        if: inputs.step != 'parents'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/hospital-campus-candidates.sh

      - name: Find nearby hospital listings for the shortlist
        if: inputs.step == 'parents'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/hospital-campus-parents.sh

      # Read only: what the directory (loaded from NPPES) holds for these NPIs,
      # to confirm the NPI a campus bills under. Printed, not committed.
      - name: Look up NPIs
        if: inputs.step == 'lookup'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NPIS: ${{ inputs.npis }}
        run: |
          list=$(echo "$NPIS" | tr -cd '0-9,' | sed 's/,,*/,/g; s/^,//; s/,$//')
          [ -n "$list" ] || { echo "::error::Give npis"; exit 1; }
          for t in clinics provider_individuals; do
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -c "select '$t' as tbl, npi, name, address, city, state, zip, taxonomy_code, primary_taxonomy, latitude, longitude from public.$t where npi in ($list) order by npi" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -c "select 'secondary' as tbl, parent_npi, name, address, city, zip, taxonomy_code from public.clinic_secondary_locations where parent_npi in ($list) order by parent_npi" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the list
        if: inputs.step != 'lookup'
        run: |
          git add supabase/reference/hospital-campus-*
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Hospital campus candidates $(date -u +%F) [skip netlify]"
          git pull -q --rebase origin main
          git push origin HEAD:main

name: Procedure sources

# Manual only, read only. Describes the files the Procedures panel will add
# beside Medicare Part B: Medicaid provider spending by procedure (HHS, read in
# place as Parquet with DuckDB) and the Medicare outpatient and inpatient
# hospital files (CMS catalog). Commits what it finds to
# supabase/reference/procedure-sources/. Touches no database, needs no secret.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install duckdb==1.1.3

      - name: Medicare hospital files
        continue-on-error: true
        run: node scripts/procedure-sources-discover.mjs supabase/reference/procedure-sources

      - name: Medicaid provider spending
        continue-on-error: true
        run: python3 scripts/medicaid-procedures-discover.py supabase/reference/procedure-sources

      - name: Commit what was found
        if: always()
        run: |
          git add supabase/reference/procedure-sources
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Procedure source discovery $(date -u +%F) [skip netlify]"
          git push origin HEAD:main

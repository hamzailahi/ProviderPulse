name: Import Medicare activity (CMS PUF + PECOS)

# Feeds npi_activity, the behavioural ground truth behind the Directory
# Accuracy Engine. The Physician & Other Practitioners PUF is annual and the
# Order & Referring file changes more often, so monthly keeps enrolment fresh
# without waiting a year for the claims side.
#
# Runs on the 12th to stay clear of the LEIE import on the 8th -- two large
# imports writing to the same project on the same morning is avoidable noise.
on:
  schedule:
    - cron: '0 7 12 * *'
  workflow_dispatch:
    inputs:
      discover:
        description: 'DISCOVER ONLY: print the CMS catalog entries that match, then stop. Downloads nothing.'
        type: boolean
        default: false
      dry_run:
        description: 'Parse and report totals without writing to Supabase'
        type: boolean
        default: false
      puf_url:
        description: 'Direct Physician PUF CSV URL (blank = resolve from the CMS catalog)'
        type: string
        required: false
      or_url:
        description: 'Direct Order & Referring CSV URL (blank = resolve from the CMS catalog)'
        type: string
        required: false
      year:
        description: 'Data year for PUF rows (blank = take it from the resolved distribution)'
        type: string
        required: false

# Never expose the service role key to a fork's workflow run
concurrency: medicare-activity-import

jobs:
  import:
    if: github.repository_owner == 'hamzailahi'
    runs-on: ubuntu-latest
    # The real files are far larger than the LEIE CSV; give the download and
    # two streaming passes room without letting a hung fetch run all day.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Fails loudly if the secrets were never added, rather than parsing two
      # large files and only then discovering there is nowhere to write them.
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets are required"
            exit 1
          fi

      # The dataset URL is resolved from the CMS catalog at run time rather than
      # pinned, because CMS mints a new UUID per year. The catalog URL, the DCAT
      # field names and the title patterns are still assumptions written without
      # access to data.cms.gov, so this step is their verification: run with
      # `discover` first and the log prints exactly what matched.
      #
      # Inputs are passed via env, not interpolated into the shell command, so a
      # URL containing shell metacharacters cannot break out of the argument.
      - name: Import Medicare activity into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IN_DISCOVER: ${{ inputs.discover }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_PUF_URL: ${{ inputs.puf_url }}
          IN_OR_URL: ${{ inputs.or_url }}
          IN_YEAR: ${{ inputs.year }}
        run: |
          set -euo pipefail
          ARGS=()
          # `|| true` because a false [ ] test is a non-zero exit, which would
          # abort the whole step under `set -e` when an input is simply unset.
          [ "${IN_DISCOVER:-}" = "true" ] && ARGS+=(--discover) || true
          [ "${IN_DRY_RUN:-}" = "true" ] && ARGS+=(--dry-run) || true
          [ -n "${IN_PUF_URL:-}" ] && ARGS+=(--puf-url "$IN_PUF_URL") || true
          [ -n "${IN_OR_URL:-}" ] && ARGS+=(--or-url "$IN_OR_URL") || true
          [ -n "${IN_YEAR:-}" ] && ARGS+=(--year "$IN_YEAR") || true
          echo "running: node scripts/import-medicare-activity.mjs ${ARGS[*]-}"
          # ${ARGS[@]+...} so an EMPTY array expands to nothing at all. The
          # ":-" form would pass one empty-string argument instead.
          # ~1.5M NPIs held in a Map plus a Set; the default heap is tight.
          node --max-old-space-size=4096 scripts/import-medicare-activity.mjs ${ARGS[@]+"${ARGS[@]}"}

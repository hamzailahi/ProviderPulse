name: Site weighting before and after

# Manual, read only: market-score with and without the site weighting for a
# few ZIPs (scripts/live/weight-compare.mjs). Commits
# supabase/reference/weight-compare.md.

on:
  workflow_dispatch:
    inputs:
      zips:
        default: "38017 76104 59601 10001"

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --prefix v2
      - run: node scripts/live/weight-compare.mjs ${{ inputs.zips }}
      - name: Commit the report
        run: |
          git add supabase/reference/weight-compare.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Site weighting before and after $(date -u +%F) [skip netlify]"
          git pull -q --rebase origin main
          git push origin HEAD:main

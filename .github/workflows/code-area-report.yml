name: Procedure codes around a ZIP

# Manual, read only. Pulls a list of procedure codes within a radius of one
# ZIP from the public procedure tables (Medicare by clinician, Medicaid by ZIP
# and specialty, Medicare hospital outpatient groups) through the publishable
# key and uploads the CSVs as an artifact (scripts/live/code-area-report.mjs).
# Nothing is written to the database or committed.

on:
  workflow_dispatch:
    inputs:
      zip:
        description: Centre ZIP
        default: "76117"
      radius:
        description: Radius in miles (1 to 50)
        default: "20"
      codes:
        description: Comma-separated CPT/HCPCS codes
        default: "43235,43239,45378,45380,45385"
      push_branch:
        description: "Optional: also push the CSVs to this throwaway branch (must start with tmp/), for a session that cannot download artifacts. Delete it afterwards."
        default: ""

permissions:
  contents: write   # only used by the optional tmp/ branch push

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull the codes
        env:
          ZIP: ${{ inputs.zip }}
          RADIUS: ${{ inputs.radius }}
          CODES: ${{ inputs.codes }}
        run: node scripts/live/code-area-report.mjs "$ZIP" "$RADIUS" "$CODES" out
      - uses: actions/upload-artifact@v4
        with:
          name: code-area-report
          path: out/
          retention-days: 7
      - name: Push the CSVs to a throwaway branch
        if: inputs.push_branch != ''
        env:
          BRANCH: ${{ inputs.push_branch }}
        run: |
          case "$BRANCH" in tmp/*) ;; *) echo "push_branch must start with tmp/"; exit 1;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$BRANCH"
          git rm -rq --cached .
          git add -f out/
          git commit -qm "Code area report data (temporary branch; delete after use) [skip netlify]"
          git push -f origin "HEAD:refs/heads/$BRANCH"
